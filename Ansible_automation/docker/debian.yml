---
- hosts: all
  name: Install Docker
  become: true

  vars:
    docker_group: docker

  tasks:
    - name: Install required packages
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
        state: present
        update_cache: true

    - name: Create keyrings directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Download Docker GPG key
      ansible.builtin.get_url:
        url: "https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg"
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Get DEB architecture
      ansible.builtin.command: dpkg --print-architecture
      register: deb_architecture
      changed_when: false

    - name: Handle Kali Linux repository mapping
      ansible.builtin.set_fact:
        docker_distribution: debian
        docker_release: bullseye
      when:
        - ansible_distribution == "Kali"
        - ansible_distribution_release == "kali-rolling"

    - name: Set default Docker repository values
      ansible.builtin.set_fact:
        docker_distribution: "{{ ansible_distribution | lower }}"
        docker_release: "{{ ansible_distribution_release }}"
      when: docker_distribution is not defined

    - name: Add Docker repository
      ansible.builtin.apt_repository:
        repo: >-
          deb [arch={{ deb_architecture.stdout }}
          signed-by=/etc/apt/keyrings/docker.asc]
          https://download.docker.com/linux/{{ docker_distribution }} {{
          docker_release }} stable
        filename: docker
        state: present

    - name: Install Docker packages
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: true

    - name: Enable and start Docker
      ansible.builtin.service:
        name: docker
        enabled: true
        state: started

    - name: Ensure docker group exists
      ansible.builtin.group:
        name: "{{ docker_group }}"
        state: present

    - name: Add current user to docker group
      ansible.builtin.user:
        name: "{{ ansible_env.SUDO_USER | default(ansible_user) }}"
        groups: "{{ docker_group }}"
        append: true
